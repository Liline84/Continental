```html
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>alex_tech • Profil Futuriste</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#050816;
    --card:rgba(255,255,255,.05);
    --border:rgba(255,255,255,.08);
    --text:#ffffff;
    --muted:#9aa4b2;
    --cyan:#00f7ff;
    --violet:#7a5cff;
    --pink:#ff00c8;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
}

/* HEADER */

.profile-container{
    max-width:1100px;
    margin:auto;
    padding:30px 15px;
}

.profile-header{
    display:flex;
    flex-wrap:wrap;
    gap:35px;
    align-items:center;

    background:var(--card);
    backdrop-filter:blur(25px);

    border:1px solid var(--border);
    border-radius:30px;

    padding:30px;
}

.avatar-ring{
    width:170px;
    height:170px;

    padding:4px;

    border-radius:50%;

    background:linear-gradient(
        45deg,
        var(--cyan),
        var(--violet),
        var(--pink)
    );

    animation:spin 10s linear infinite;
}

.avatar-ring img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
    border:4px solid #050816;
}

@keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

.profile-details{
    flex:1;
}

.username-row{
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
}

.username-row h1{
    font-size:2rem;
}

.verified{
    color:var(--cyan);
    font-size:1.3rem;
}

.follow-btn,
.message-btn{
    border:none;
    cursor:pointer;
    border-radius:15px;
    padding:12px 24px;
    color:white;
}

.follow-btn{
    background:linear-gradient(
        90deg,
        var(--cyan),
        var(--violet)
    );
}

.message-btn{
    background:rgba(255,255,255,.08);
}

.stats{
    display:flex;
    gap:30px;
    margin:25px 0;
}

.stats div{
    text-align:center;
}

.stats strong{
    display:block;
    font-size:1.2rem;
}

.stats span{
    color:var(--muted);
}

.bio{
    color:var(--muted);
    line-height:1.7;
}

.contact-btn{
    display:inline-block;
    margin-top:20px;
    text-decoration:none;
    color:white;

    background:#25D366;

    padding:12px 20px;
    border-radius:15px;
}

/* STORIES */

.stories{
    display:flex;
    gap:20px;
    margin:30px 0;
    overflow:auto;
}

.story{
    text-align:center;
}

.story-circle{
    width:90px;
    height:90px;
    padding:3px;
    border-radius:50%;

    background:linear-gradient(
        45deg,
        var(--cyan),
        var(--pink)
    );
}

.story-circle img{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
}

.story span{
    display:block;
    margin-top:8px;
    font-size:.8rem;
}

/* TABS */

.tabs{
    display:flex;
    justify-content:center;
    gap:30px;
    margin-bottom:30px;
}

.tabs button{
    background:none;
    border:none;
    color:white;
    font-size:1rem;
    cursor:pointer;
}

/* POSTS */

.posts-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.post{
    position:relative;
    overflow:hidden;
    border-radius:20px;
    aspect-ratio:1;
    background:#111;
}

.post img,
.post video{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:.5s;
}

.post:hover img,
.post:hover video{
    transform:scale(1.08);
}

.post-info{
    position:absolute;
    inset:0;

    background:rgba(0,0,0,.65);

    opacity:0;
    transition:.3s;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;
    padding:15px;
}

.post:hover .post-info{
    opacity:1;
}

.post-info h3{
    margin-bottom:10px;
}

.price{
    color:var(--cyan);
    margin-bottom:10px;
}

.buy-btn{
    background:linear-gradient(
        90deg,
        var(--cyan),
        var(--violet)
    );

    text-decoration:none;
    color:white;

    padding:10px 16px;
    border-radius:12px;
}

@media(max-width:768px){

.posts-grid{
    grid-template-columns:repeat(2,1fr);
}

.profile-header{
    text-align:center;
    justify-content:center;
}

.stats{
    justify-content:center;
}

}

</style>
</head>

<body>

            </div>

</div>

</html>
